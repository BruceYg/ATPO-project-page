 <title id="chart-title">Precision and recall across G-ATR training targets</title>
 <desc id="chart-description">Global adaptive reward (G-ATR) results on SafeWatch-Bench-Real, Table 3. Each point represents a different training target, not an inference-time change to a fixed checkpoint. target 0.2: precision 66.33 percent, recall 86.55 percent; target 0.5: precision 76.18 percent, recall 80.71 percent; target 1: precision 75.74 percent, recall 78.81 percent; target 2: precision 75.72 percent, recall 69.05 percent; target 5: precision 78.56 percent, recall 67.62 percent. The horizontal axis is logarithmic. Target FN/FP ratios are not guaranteed achieved ratios.</desc>
