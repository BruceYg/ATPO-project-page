 <title id="control-ratio-str-title">Achieved FN/FP ratio across static-reward settings</title>
 <desc id="control-ratio-str-desc">Static Tversky reward (STR) on SafeWatch-Bench-Real, Table 3. The achieved FN/FP ratio does not change in a consistent order with the fixed penalty ratio: alpha/beta 1/5: 1.58; 1/2: 1.63; 1/1: 0.97; 2/1: 1.20; 5/1: 0.80.</desc>
