 <title id="chart-title">Jaccard results on SafeWatch-Bench-Real</title>
 <desc id="chart-description">Jaccard scores on SafeWatch-Bench-Real, from Table 1 of the ATPO paper. Qwen2.5-VL-7B: 40.66; Qwen3-VL-235B-A22B: 55.85; InternVL3.5-38B: 60.61; SafeWatch-8B: 70.69; ATPO-G-7B: 75.44; ATPO-C-7B: 75.15. Higher is better. ATPO entries are trained on this benchmark; the three general-purpose VLMs are evaluated zero-shot.</desc>
