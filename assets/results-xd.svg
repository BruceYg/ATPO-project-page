 <title id="chart-title">Jaccard results on XD-Violence</title>
 <desc id="chart-description">Jaccard scores on XD-Violence, from Table 1 of the ATPO paper. Qwen2.5-VL-7B: 76.54; Qwen3-VL-235B-A22B: 82.53; InternVL3.5-38B: 83.38; SafeWatch-8B: 79.84; ATPO-G-7B: 88.17; ATPO-C-7B: 87.60. Higher is better. ATPO entries are trained on this benchmark; the three general-purpose VLMs are evaluated zero-shot.</desc>
